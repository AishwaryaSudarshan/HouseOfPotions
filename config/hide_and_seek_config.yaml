behaviors:
  HideAndSeekHunter: # MUST match Behavior Name in Behavior Parameters
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 5120
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128 # Adjust complexity (64, 128, 256)
      num_layers: 2 # Adjust depth (1, 2, 3)
      vis_encode_type: simple # Use 'resnet' or 'match3' if using Visual Observations
    reward_signals:
      extrinsic:
        gamma: 0.99 # Discount factor - how much future rewards matter
        strength: 1.0
    max_steps: 500000 # Total training steps
    time_horizon: 64
    summary_freq: 10000 # How often to save summaries for TensorBoard